<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>iOS Notification Storm Barrage v2</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Plus Jakarta Sans", "Inter", sans-serif;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }

    /* Container for dynamic sliding notifications */
    #notif-stream {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }

    .notif-item {
      position: relative;
      width: 100%;
      background: rgba(24, 24, 28, 0.90);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 32px;
      padding: 18px 24px;
      box-shadow: 
        0 18px 45px rgba(0, 0, 0, 0.7),
        0 4px 12px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      gap: 5px;
      transform-origin: center top;
      opacity: 0;
      transform: translateY(-160px) scale(0.92);
      transition: none; /* Controlled manually by frame clock */
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .app-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .app-icon.messages {
      background: #34c759;
      box-shadow: 0 2px 8px rgba(52, 199, 89, 0.4);
    }

    .app-icon.chase {
      background: #117aca;
      box-shadow: 0 2px 8px rgba(17, 122, 202, 0.4);
    }

    .app-icon.instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
      box-shadow: 0 2px 8px rgba(214, 36, 159, 0.4);
    }

    .app-icon.snapchat {
      background: #fffc00;
      box-shadow: 0 2px 8px rgba(255, 252, 0, 0.4);
    }

    .app-icon.snapchat svg {
      fill: #000000;
    }

    .app-icon.tiktok {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .app-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .app-title {
      color: #a1a1aa;
      font-size: 19px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .time-stamp {
      color: #71717a;
      font-size: 18px;
      font-weight: 500;
    }

    .body-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sender {
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .message {
      color: #f4f4f5;
      font-size: 25px;
      font-weight: 500;
      line-height: 1.28;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="notif-stream"></div>
  </div>

  <script>
    // List of 8 random, realistic, urgent notifications
    const NOTIFICATIONS_DATA = [
      {

      {

        sender: 'Mom ❤️',

      },
      {

        iconSvg: '<path d=\"M2 20h20v-2H2v2zm2-4h3v-7H4v7zm6 0h3v-7h-3v7zm6 0h3v-7h-3v7zM2 7l10-5 10 5v2H2V7z\"/>',
        sender: 'Chase Alert 💳',
        text: 'Walmart Supercenter: $0.00 (Subsidy Card Discount -$1,400.00 Applied ✅)'
      },
      {
        id: 4,
        time: 1.70,
        app: 'Messages',
        appClass: 'messages',
        iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>',
        sender: 'Tyler 💀',
        text: 'DUDE I JUST TRIED IT IT ACTUALLY WENT THROUGH WTF'
      },
      {
        id: 5,
        time: 2.15,
        app: 'Instagram',
        appClass: 'instagram',
        iconSvg: '<path d=\"M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z\"/>',
        sender: 'emily_v ✨',
        text: 'replied to your story: HOW IS THIS EVEN LEGAL 😭 send link'
      },
      {
        id: 6,
        time: 2.60,
        app: 'Snapchat',
        appClass: 'snapchat',
        iconSvg: '<path d=\"M12 2.5c-3.1 0-5.3 2.1-5.3 4.9 0 1.4.6 2.7 1.2 3.8-.3.3-.8.6-1.5.8-.3.1-.5.3-.5.6 0 .4.3.6.7.7.9.2 1.6.6 2.2 1.2-.6 1.4-1.8 2.2-3.8 2.5-.4.1-.7.4-.7.8 0 .4.3.7.7.8 1.4.3 2.6 1 3.5 2.1.2.3.6.4.9.4.2 0 .4-.1.6-.2 1.3-.8 2.6-1.2 4.1-1.2s2.8.4 4.1 1.2c.2.1.4.2.6.2.3 0 .7-.1.9-.4.9-1.1 2.1-1.8 3.5-2.1.4-.1.7-.4.7-.8 0-.4-.3-.7-.7-.8-2-.3-3.2-1.1-3.8-2.5.6-.6 1.3-1 2.2-1.2.4-.1.7-.3.7-.7 0-.3-.2-.5-.5-.6-.7-.2-1.2-.5-1.5-.8.6-1.1 1.2-2.4 1.2-3.8 0-2.8-2.2-4.9-5.3-4.9z\"/>',
        sender: 'Dave 👻',
        text: 'did they patch the $1400 subsidy card yet?? send link pls'
      },
      {
        id: 7,
        time: 3.05,
        app: 'Messages',
        appClass: 'messages',
        iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>',
        sender: 'Group Chat (8) 💬',
        text: 'Jordan: bro everyone go claim the card right now before it dies'
      },
      {
        id: 8,
        time: 3.50,
        app: 'Messages',
        appClass: 'messages',
        iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>',
        sender: 'Sarah 🛒',
        text: 'literally got 2 carts full for zero dollars thank you sm 🙏'
      }
    ];

    const streamEl = document.getElementById('notif-stream');

    // Build DOM
    NOTIFICATIONS_DATA.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'notif-item';
      card.id = `card-${item.id}`;
      card.innerHTML = `
        <div class="header-row">
          <div class="app-brand">
            <div class="app-icon ${item.appClass}">
              <svg viewBox="0 0 24 24">${item.iconSvg}</svg>
            </div>
            <span class="app-title">${item.app}</span>
          </div>
          <span class="time-stamp">now</span>
        </div>
        <div class="body-row">
          <div class="sender">${item.sender}</div>
          <div class="message">${item.text}</div>
        </div>
      `;
      streamEl.appendChild(card);
    });

    /**
     * Exact physics-based frame clock for sliding down animation.
     * Computes the exact transform and opacity for every card at time t (seconds).
     */
    window.seekTo = function (t) {
      const duration = 0.32; // Slide down animation duration in seconds

      NOTIFICATIONS_DATA.forEach((item, index) => {
        const card = document.getElementById(`card-${item.id}`);
        if (!card) return;

        const arrival = item.time;
        if (t < arrival) {
          // Hasn't arrived yet -> completely hidden above viewport
          card.style.display = 'none';
          card.style.opacity = '0';
          card.style.transform = 'translateY(-200px) scale(0.92)';
        } else {
          card.style.display = 'flex';
          const elapsed = t - arrival;
          const progress = Math.min(1, elapsed / duration);

          // Spring bounce ease: easeOutBack
          const c1 = 1.70158;
          const c3 = c1 + 1;
          const easeOutBack = progress === 1 ? 1 : 1 + c3 * Math.pow(progress - 1, 3) + c1 * Math.pow(progress - 1, 2);

          const yOffset = (1 - easeOutBack) * -180; // Slides down from -180px to 0px
          const scale = 0.92 + (easeOutBack * 0.08);
          const opacity = Math.min(1, progress * 2.5);

          card.style.opacity = String(opacity);
          card.style.transform = `translateY(${yOffset.toFixed(2)}px) scale(${scale.toFixed(3)})`;
        }
      });
    };

    // Initial render at t=0
    window.seekTo(0);
  </script>
</body>
</html>
