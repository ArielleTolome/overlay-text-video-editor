<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta data-composition-id="tiktok-card" data-width="1080" data-height="1920" />
  <title>TikTok Card Caption Overlay</title>

  <!-- Google Fonts: Plus Jakarta Sans / Montserrat fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- GSAP for HyperFrames timeline support -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .caption-wrapper {
      position: absolute;
      top: var(--caption-top, 42%);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 860px;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .caption-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 28px;
      padding: 26px 36px;
      box-shadow: 
        0 8px 30px rgba(0, 0, 0, 0.26),
        0 2px 8px rgba(0, 0, 0, 0.14);
      display: inline-block;
      width: auto;
      max-width: 100%;
      text-align: center;
      box-sizing: border-box;
    }

    .caption-text {
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "TikTok Sans", "Plus Jakarta Sans", "Montserrat", "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: var(--caption-font-size, 46px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.015em;
      text-align: center;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Optional background video layer for standalone preview mode */
    #bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      z-index: 0;
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="tiktok-card">
    <video id="bg-video" muted playsinline></video>
    <div class="caption-wrapper" id="caption-wrapper">
      <div class="caption-card" id="caption-card">
        <div class="caption-text" id="caption-text">{{CAPTION}}</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Dynamic Caption & Parameter Resolution
      const params = new URLSearchParams(window.location.search);
      const urlText = params.get("text") || params.get("caption");
      const urlTop = params.get("top");
      const urlSize = params.get("size") || params.get("fontSize");
      const bgVideoSrc = params.get("bg") || params.get("video");

      const cardEl = document.getElementById("caption-card");
      const captionEl = document.getElementById("caption-text");
      const wrapperEl = document.getElementById("caption-wrapper");
      const bgVideoEl = document.getElementById("bg-video");

      // Resolve caption text from window config, URL params, or placeholder
      let caption = window.CAPTION || (window.COMPOSITION_CONFIG && window.COMPOSITION_CONFIG.caption) || urlText;
      if (!caption || caption === "{{CAPTION}}") {
        const rawContent = captionEl.textContent.trim();
        if (rawContent && rawContent !== "{{CAPTION}}") {
          caption = rawContent;
        } else {
          caption = "if u buy groceries and haven't claimed ur $500 allowance card yet u are literally throwing away money 😭";
        }
      }

      captionEl.textContent = caption;

      // Adjust dynamic styles if specified
      if (urlTop) {
        wrapperEl.style.setProperty("--caption-top", urlTop.includes("%") || urlTop.includes("px") ? urlTop : urlTop + "%");
      }
      if (urlSize) {
        captionEl.style.setProperty("--caption-font-size", urlSize.includes("px") ? urlSize : urlSize + "px");
      }

      // Standalone preview background
      if (bgVideoSrc) {
        bgVideoEl.src = bgVideoSrc;
        bgVideoEl.style.display = "block";
        bgVideoEl.play().catch(() => {});
      }

      // Auto-fit font size for long text
      if (caption.length > 120) {
        captionEl.style.fontSize = "38px";
        cardEl.style.padding = "24px 32px";
      } else if (caption.length > 85) {
        captionEl.style.fontSize = "42px";
      }

      // Register GSAP Timeline for HyperFrames
      window.__timelines = window.__timelines || {};
      const duration = parseFloat(params.get("duration") || "15");
      const tl = gsap.timeline({ paused: true });

      // Subtle pop-in on entrance and hold
      tl.fromTo(
        cardEl,
        { opacity: 0, scale: 0.95, y: 15 },
        { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "power2.out" },
        0
      );
      tl.to(cardEl, { duration: duration - 0.35 }, "+=0");

      window.__timelines["tiktok-card"] = tl;
    })();
  </script>
</body>
</html>
