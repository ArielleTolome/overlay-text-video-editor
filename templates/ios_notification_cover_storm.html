<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>iOS Notification Cover & Fade Barrage</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
    }

    /* Fixed top anchor slot where cards slide down, cover, and replace */
    .anchor-slot {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 155px;
      pointer-events: none;
    }

    .notif-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 155px;
      background: rgba(22, 22, 26, 0.96);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 36px;
      padding: 22px 28px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.8),
        0 4px 16px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      transform-origin: center top;
      opacity: 0;
      transform: translateY(-200px) scale(0.95);
      will-change: transform, opacity;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .app-icon.messages {
      background: #34c759;
      box-shadow: 0 2px 8px rgba(52, 199, 89, 0.45);
    }

    .app-icon.chase {
      background: #117aca;
      box-shadow: 0 2px 8px rgba(17, 122, 202, 0.45);
    }

    .app-icon.instagram {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
      box-shadow: 0 2px 8px rgba(214, 36, 159, 0.45);
    }

    .app-icon.snapchat {
      background: #fffc00;
      box-shadow: 0 2px 8px rgba(255, 252, 0, 0.4);
    }

    .app-icon.snapchat svg {
      fill: #000000;
    }

    .app-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .app-title {
      color: #a1a1aa;
      font-size: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .time-stamp {
      color: #71717a;
      font-size: 19px;
      font-weight: 500;
    }

    .body-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sender {
      color: #ffffff;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .message {
      color: #f4f4f5;
      font-size: 27px;
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="anchor-slot" id="slot"></div>
  </div>

  <script>
    // 6 dialed-back, perfectly timed notifications arriving every 0.7s - 0.8s
    const NOTIFICATIONS = [
      { id: 1, time: 0.60, app: 'Messages', appClass: 'messages', iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>', sender: 'Alex 🔥', text: 'BRO WHERE THE F*** IS THE LINK??? SEND IT RN' },
      { id: 2, time: 1.30, app: 'Messages', appClass: 'messages', iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>', sender: 'Mom ❤️', text: 'call me right now how was your Walmart receipt $0.00?? 😭' },
      { id: 3, time: 2.00, app: 'Chase Mobile', appClass: 'chase', iconSvg: '<path d=\"M2 20h20v-2H2v2zm2-4h3v-7H4v7zm6 0h3v-7h-3v7zm6 0h3v-7h-3v7zM2 7l10-5 10 5v2H2V7z\"/>', sender: 'Chase Alert 💳', text: 'Walmart Supercenter: $0.00 (Allowance Discount -$500.00 Applied ✅)' },
      { id: 4, time: 2.80, app: 'Messages', appClass: 'messages', iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>', sender: 'Tyler 💀', text: 'DUDE IT ACTUALLY WORKED WTF I GOT $500 FREE' },
      { id: 5, time: 3.60, app: 'Instagram', appClass: 'instagram', iconSvg: '<path d=\"M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z\"/>', sender: 'emily_v ✨', text: 'replied to story: HOW DID YOU GET THIS SEND LINK 😭' },
      { id: 6, time: 4.50, app: 'Messages', appClass: 'messages', iconSvg: '<path d=\"M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z\"/>', sender: 'Sarah 🛒', text: 'literally got 2 carts full for $0.00 thank you sm 🙏' }
    ];

    const slotEl = document.getElementById('slot');

    // Build DOM elements
    NOTIFICATIONS.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'notif-card';
      card.id = `card-${item.id}`;
      card.style.zIndex = String(index + 1);
      card.innerHTML = `
        <div class="header-row">
          <div class="app-brand">
            <div class="app-icon ${item.appClass}">
              <svg viewBox="0 0 24 24">${item.iconSvg}</svg>
            </div>
            <span class="app-title">${item.app}</span>
          </div>
          <span class="time-stamp">now</span>
        </div>
        <div class="body-row">
          <div class="sender">${item.sender}</div>
          <div class="message">${item.text}</div>
        </div>
      `;
      slotEl.appendChild(card);
    });

    /**
     * Exact cover-and-fade physics.
     * When Card (i+1) arrives, Card (i) fades away to 0 opacity and scales down beneath it.
     */
    window.seekTo = function (t) {
      const slideDuration = 0.22; // Smooth 220ms slide-down arrival
      const fadeDuration = 0.20;  // Preceding card fades out over 200ms

      NOTIFICATIONS.forEach((item, index) => {
        const card = document.getElementById(`card-${item.id}`);
        if (!card) return;

        const arrival = item.time;
        const nextArrival = index < NOTIFICATIONS.length - 1 ? NOTIFICATIONS[index + 1].time : Infinity;

        if (t < arrival) {
          // Hasn't arrived yet: offscreen above
          card.style.display = 'none';
          card.style.opacity = '0';
          card.style.transform = 'translateY(-200px) scale(0.95)';
        } else if (t >= arrival && t < nextArrival) {
          // Active card on top
          card.style.display = 'flex';
          const elapsed = t - arrival;
          const progress = Math.min(1, elapsed / slideDuration);

          // Spring drop ease
          const c1 = 1.70158;
          const c3 = c1 + 1;
          const easeOutBack = progress === 1 ? 1 : 1 + c3 * Math.pow(progress - 1, 3) + c1 * Math.pow(progress - 1, 2);

          const yOffset = (1 - easeOutBack) * -200;
          const scale = 0.95 + (easeOutBack * 0.05);

          card.style.opacity = '1';
          card.style.transform = `translateY(${yOffset.toFixed(1)}px) scale(${scale.toFixed(3)})`;
        } else {
          // Being covered by subsequent card: fade away and scale down slightly
          const timeSinceCover = t - nextArrival;
          const fadeProgress = Math.min(1, timeSinceCover / fadeDuration);

          if (fadeProgress >= 1) {
            // Completely faded away and hidden
            card.style.display = 'none';
            card.style.opacity = '0';
          } else {
            card.style.display = 'flex';
            card.style.opacity = String(1 - fadeProgress);
            const subScale = 1 - (fadeProgress * 0.04);
            card.style.transform = `translateY(0px) scale(${subScale.toFixed(3)})`;
          }
        }
      });
    };

    window.seekTo(0);
  </script>
</body>
</html>
