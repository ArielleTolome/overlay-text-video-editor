<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta data-composition-id="tiktok-comment" data-width="1080" data-height="1920" />
  <title>TikTok Comment Caption Overlay</title>

  <!-- Google Fonts: Inter / Plus Jakarta Sans fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- GSAP for HyperFrames timeline support -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .comment-wrapper {
      position: absolute;
      top: var(--caption-top, 38%);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 860px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .comment-card {
      position: relative;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 
        0 12px 36px rgba(0, 0, 0, 0.35),
        0 4px 12px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Small speech bubble tail */
    .comment-card::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 48px;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 14px solid rgba(255, 255, 255, 0.98);
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fe2c55, #25f4ee);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
      font-weight: 700;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .user-info {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .username {
      color: #161823;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .reply-badge {
      color: #8a8b91;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", sans-serif;
      font-size: 21px;
      font-weight: 500;
    }

    .comment-body {
      color: #161823;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", -apple-system, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: var(--caption-font-size, 40px);
      font-weight: 600;
      line-height: 1.28;
      letter-spacing: -0.015em;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="tiktok-comment">
    <div class="comment-wrapper" id="caption-wrapper">
      <div class="comment-card" id="comment-card">
        <div class="comment-header">
          <div class="avatar" id="avatar">SJ</div>
          <div class="user-info">
            <div class="username-row">
              <span class="username" id="username">sarah_j</span>
            </div>
            <span class="reply-badge" id="reply-badge">Replying to your video</span>
          </div>
        </div>
        <div class="comment-body" id="caption-text">{{CAPTION}}</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const captionTextEl = document.getElementById('caption-text');
      const captionWrapperEl = document.getElementById('caption-wrapper');
      const commentCardEl = document.getElementById('comment-card');

      // HyperFrames variable resolution
      if (typeof window !== 'undefined' && window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
        const vars = window.__hyperframes.getVariables();
        if (vars.caption) {
          captionTextEl.textContent = vars.caption;
        }
        if (vars.fontSize) {
          document.documentElement.style.setProperty('--caption-font-size', typeof vars.fontSize === 'number' ? vars.fontSize + 'px' : vars.fontSize);
        }
        if (vars.top) {
          document.documentElement.style.setProperty('--caption-top', typeof vars.top === 'number' ? vars.top + '%' : vars.top);
        }
      } else if (typeof window !== 'undefined' && window.CAPTION) {
        captionTextEl.textContent = window.CAPTION;
      }

      // GSAP timeline animation
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          commentCardEl,
          { opacity: 0, scale: 0.88, y: 30 },
          { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }
        );

        if (!window.__timelines) {
          window.__timelines = {};
        }
        window.__timelines['tiktok-comment'] = tl;
        window.__timelines['comment'] = tl;
      }
    })();
  </script>
</body>
</html>
