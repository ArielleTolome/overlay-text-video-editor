<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta data-composition-id="tiktok-typewriter" data-width="1080" data-height="1920" />
  <title>TikTok Native Typewriter Text Overlay</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,700;1,700&family=Special+Elite&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    #stage { position: relative; width: 1080px; height: 1920px; display: flex; justify-content: center; align-items: flex-start; }
    .caption-wrapper { position: absolute; top: var(--caption-top, 40%); left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 960px; padding: 0 20px; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 10; }
    .typewriter-stack { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100%; text-align: center; }
    .typewriter-line { display: inline-block; background: #000000; color: #ffffff; font-family: "Courier Prime", "Special Elite", "Courier New", Courier, monospace, "Apple Color Emoji", "Segoe UI Emoji"; font-size: var(--caption-font-size, 48px); font-weight: 700; line-height: 1.25; letter-spacing: -0.01em; padding: 12px 28px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); text-align: center; word-break: break-word; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="tiktok-typewriter">
    <div class="caption-wrapper" id="caption-wrapper">
      <div class="typewriter-stack" id="typewriter-stack"></div>
    </div>
  </div>

  <script>
    (function () {
      const stackEl = document.getElementById("typewriter-stack");
      const wrapperEl = document.getElementById("caption-wrapper");

      let caption = window.CAPTION || "{{CAPTION}}";
      if (!caption || caption === "{{CAPTION}}") {
        caption = "Wait until you see how this story ends...\nMy Walmart receipt said $0.00";
      }

      function formatLines(text) {
        if (text.includes("\n")) return text.split("\n").map(l => l.trim()).filter(Boolean);
        const words = text.split(/\s+/);
        if (words.length <= 4) return [text];
        const targetWords = words.length >= 10 ? 4 : (words.length >= 6 ? 3 : 2);
        const lines = [];
        let cur = [];
        for (const w of words) {
          cur.push(w);
          if (cur.length >= targetWords || cur.join(" ").length > 24) {
            lines.push(cur.join(" "));
            cur = [];
          }
        }
        if (cur.length > 0) lines.push(cur.join(" "));
        return lines;
      }

      const lines = formatLines(caption);
      stackEl.innerHTML = "";
      lines.forEach((l) => {
        const span = document.createElement("span");
        span.className = "typewriter-line";
        span.textContent = l;
        stackEl.appendChild(span);
      });
    })();
  </script>
</body>
</html>
