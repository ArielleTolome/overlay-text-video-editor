<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <meta data-composition-id="ios-notification-stack" data-width="1080" data-height="1920" />
  <title>iOS Multi-Notification Stack Overlay</title>

  <!-- Google Fonts: Inter / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- GSAP for seekable timeline rendering -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Plus Jakarta Sans", "Inter", sans-serif;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    .stack-container {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1000px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      pointer-events: none;
    }

    .ios-card {
      width: 100%;
      background: rgba(28, 28, 34, 0.88);
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 34px;
      padding: 22px 28px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.6),
        0 4px 14px rgba(0, 0, 0, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transform-origin: top center;
    }

    .ios-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    .app-icon.messages {
      background: #34c759;
      box-shadow: 0 2px 8px rgba(52, 199, 89, 0.4);
    }

    .app-icon.bank {
      background: #117aca;
      box-shadow: 0 2px 8px rgba(17, 122, 202, 0.4);
    }

    .app-icon.tiktok {
      background: linear-gradient(135deg, #fe2c55, #25f4ee);
    }

    .app-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .app-name {
      color: #aeaeb2;
      font-size: 21px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .time-stamp {
      color: #8e8e93;
      font-size: 20px;
      font-weight: 500;
    }

    .ios-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sender-name {
      color: #ffffff;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .message-text {
      color: #f4f4f5;
      font-size: 27px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -0.01em;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="ios-notification-stack">
    <img id="bg-image" src="" alt="Background" />

    <div class="stack-container" id="stack-container">
      <!-- Notification 1 -->
      <div class="ios-card" id="card-1">
        <div class="ios-header">
          <div class="app-brand">
            <div class="app-icon messages">
              <svg viewBox="0 0 24 24"><path d="M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z"/></svg>
            </div>
            <span class="app-name">Messages</span>
          </div>
          <span class="time-stamp">now</span>
        </div>
        <div class="ios-content">
          <div class="sender-name">Mom ❤️</div>
          <div class="message-text">wait did your Walmart receipt actually say $0.00?? 😭 send me the link rn</div>
        </div>
      </div>

      <!-- Notification 2 -->
      <div class="ios-card" id="card-2">
        <div class="ios-header">
          <div class="app-brand">
            <div class="app-icon bank">
              <svg viewBox="0 0 24 24"><path d="M2 20h20v-2H2v2zm2-4h3v-7H4v7zm6 0h3v-7h-3v7zm6 0h3v-7h-3v7zM2 7l10-5 10 5v2H2V7z"/></svg>
            </div>
            <span class="app-name">Chase Mobile</span>
          </div>
          <span class="time-stamp">now</span>
        </div>
        <div class="ios-content">
          <div class="sender-name">Chase Alert 💳</div>
          <div class="message-text">Walmart Supercenter: $0.00 (Grocery Allowance Card Applied ✅)</div>
        </div>
      </div>

      <!-- Notification 3 -->
      <div class="ios-card" id="card-3">
        <div class="ios-header">
          <div class="app-brand">
            <div class="app-icon messages">
              <svg viewBox="0 0 24 24"><path d="M12 3C6.477 3 2 6.92 2 11.75c0 2.52 1.22 4.79 3.19 6.36-.18 1.4-.73 2.76-1.64 3.89 1.95 0 3.75-.85 4.95-2.09.49.09.99.14 1.5.14 5.523 0 10-3.92 10-8.75S17.523 3 12 3z"/></svg>
            </div>
            <span class="app-name">Messages</span>
          </div>
          <span class="time-stamp">now</span>
        </div>
        <div class="ios-content">
          <div class="sender-name">Sarah 👯‍♀️</div>
          <div class="message-text">I just got my $1400 subsidy card it literally worked at checkout 🛒✨</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const card1 = document.getElementById('card-1');
      const card2 = document.getElementById('card-2');
      const card3 = document.getElementById('card-3');

      // GSAP Multi-Notification Cascading Timeline
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ paused: true });

        // Initial hidden state
        gsap.set([card1, card2, card3], { opacity: 0, y: -120, scale: 0.95 });

        // 1. First alert drops at T=1.0s
        tl.to(card1, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, 1.0);

        // 2. Second alert drops at T=3.2s
        tl.to(card2, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, 3.2);

        // 3. Third alert drops at T=5.5s
        tl.to(card3, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.4)' }, 5.5);

        if (!window.__timelines) window.__timelines = {};
        window.__timelines['ios-notification-stack'] = tl;
      }
    })();
  </script>
</body>
</html>
